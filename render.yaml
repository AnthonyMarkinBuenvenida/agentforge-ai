services:
  - type: web
    name: agentforge-backend
    runtime: python
    plan: 0.5c-512mb # cheapest paid plan (formerly "Starter"); disks require any paid plan, free tier cannot mount one
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard; never stored in git
      - key: DATABASE_URL
        value: sqlite:////var/data/agentforge.db # path lives on the mounted disk below
    disk:
      name: agentforge-data
      mountPath: /var/data
      sizeGB: 1
